name: Publish package

on:
  push:
    tags:
      - '*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      release_kind: ${{ steps.classify.outputs.release_kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
            echo "Tagged commit ${TAG_COMMIT} is not on main"
            exit 1
          }

      - name: Validate PEP 440 release tag
        id: classify
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          version = data["project"]["version"]

          if tag != version:
              sys.exit(f"Tag version ({tag}) != pyproject version ({version})")

          number = r"(?:0|[1-9][0-9]*)"
          stable = rf"{number}\.{number}\.{number}"
          unstable = rf"{stable}(?:\.dev{number}|a{number}|b{number}|rc{number})"

          if re.fullmatch(stable, tag):
              release_kind = "stable"
          elif re.fullmatch(unstable, tag):
              release_kind = "unstable"
          else:
              sys.exit(f"Tag {tag} is not a supported PEP 440 stable or unstable release")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"release_kind={release_kind}", file=output)

          print(f"{release_kind.capitalize()} release tag detected: {tag}")
          PY

  build:
    name: Build distribution
    needs: verify-release-tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl --with pytest pytest tests/smoke_test.py

      - name: Smoke test sdist
        run: uv run --isolated --no-project --with dist/*.tar.gz --with pytest pytest tests/smoke_test.py

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/oamc
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - publish-to-testpypi
      - verify-release-tag
    if: needs.verify-release-tag.outputs.release_kind == 'stable'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oamc
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
